<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schede">
<title>Schede palestra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="titolo">Schede</h1>
  <button id="btn-vista" class="btn-sec" type="button">Storico</button>
</header>
<main id="main"><p class="vuoto">Caricamento…</p></main>
<div id="timer" class="timer" hidden>
  <div class="timer-barra" id="timer-barra" aria-hidden="true"></div>
  <button id="timer-tempo" class="timer-tempo" type="button" aria-live="polite">2:00</button>
  <div class="timer-durate" role="group" aria-label="Durata recupero">
    <button type="button" data-durata="90">1:30</button>
    <button type="button" data-durata="120">2:00</button>
    <button type="button" data-durata="180">3:00</button>
  </div>
  <a class="timer-musica" href="music://" aria-label="Apri Musica">♫</a>
  <button id="timer-riduci" class="timer-riduci" type="button" aria-label="Nascondi timer">⌄</button>
  <button id="timer-chiudi" class="timer-chiudi" type="button" aria-label="Chiudi timer">✕</button>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg-ex" class="dlg">
  <form id="dlg-form" method="dialog">
    <h2>Aggiungi esercizio</h2>
    <label>Nome<input id="dlg-nome" type="text" list="elenco-ex" autocomplete="off" required placeholder="es. Leg Press"></label>
    <datalist id="elenco-ex"></datalist>
    <div class="dlg-riga">
      <label>Serie<input id="dlg-serie" type="number" inputmode="numeric" min="1" max="12" placeholder="3"></label>
      <label>Reps<input id="dlg-reps" type="text" inputmode="text" placeholder="8-12"></label>
    </div>
    <div class="dlg-azioni">
      <button type="button" id="dlg-annulla" class="btn-sec">Annulla</button>
      <button type="submit" class="btn-pri-inline">Aggiungi</button>
    </div>
  </form>
</dialog>
<nav id="tabbar" class="tabbar" aria-label="Schede"></nav>
<input type="file" id="file-import" accept="application/json,.json" hidden>
<script src="app.js" defer></script>
</body>
</html>
